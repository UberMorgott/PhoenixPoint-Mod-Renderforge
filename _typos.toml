# typos (https://github.com/crate-ci/typos) — run by the quality-gate `base` stack.
[files]
extend-exclude = [
  "src/Localization/strings.csv",   # seven non-English columns
  "workshop/locale/*.txt",          # Steam descriptions in eight languages
  "graphify-out/", "build/", "refs/", "native/build/",
  "native/nis/",                    # NVIDIA NIS SDK header, vendor text
]

[default]
# LOD = level of detail (graphics term), never "LOAD"
# No trailing \w*: typos only asks whether the pattern matches somewhere, so the suffix never changed the
# answer, and a \b pattern that can also consume non-ASCII word characters is one Aegis's spell stage cannot
# evaluate (it then skips every file holding a non-ASCII word).
extend-ignore-identifiers-re = ["(?i)\\blod"]

[default.extend-identifiers]
MirzaBeig = "MirzaBeig"   # vendor namespace of the game's FX pack (MirzaBeig.ParticleSystems.Rotator)

[default.extend-words]
LOD = "LOD"
lod = "lod"
# D3D12Debug.cpp hex/flag fragments and other identifier pieces typos mistakes for English
nd = "nd"
PN = "PN"
ba = "ba"
afe = "afe"
Fo = "Fo"
mis = "mis"            # prefix in probes/plans (mis-)
Managment = "Managment"  # game class UIStateModManagment